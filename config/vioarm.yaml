vio_nodes:

  - roslaunch vio_launch namespaced.launch         machine:=rpi5-ubuntu camera:=radius_r visualize:=false
  - roslaunch vio_launch namespaced.launch         machine:=silver      camera:=torso visualize:=false
  - rosrun tf static_transform_broadcaster 0 0 0 0 0 0 imu/torso imu/humerus 100
  - roslaunch vio_launch common_frames.launch
  - roslaunch ar_test calibrate_camera_positions.launch  camera_name:=radius_r
  - roslaunch ar_test calibrate_camera_positions.launch  camera_name:=torso
  - roslaunch ar_test calibrate_marker.launch  camera_name:=radius_r
  - roslaunch ar_test calibrate_marker.launch  camera_name:=torso
