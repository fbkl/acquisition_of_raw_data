imu_viz:
  - if [ "${SHOW_VIZ_OTHER}" = True ] ; then  rviz -d /catkin_ws/src/ros_biomech/ximu3_ros/ximu_line.rviz ; fi
  - roslaunch ximu3_ros upright.launch

imu_nodes:

  #- roslaunch ximu3_ros upper_thorax.launch do_calibration:=true wait_to_start:=$WAIT_TO_START dummy_publisher:=$DUMMY_IMUS
  #- roslaunch ximu3_ros upper_humerus.launch do_calibration:=true wait_to_start:=$WAIT_TO_START dummy_publisher:=$DUMMY_IMUS
  #- roslaunch ximu3_ros upper_radius.launch do_calibration:=true wait_to_start:=$WAIT_TO_START dummy_publisher:=$DUMMY_IMUS
  - rosrun ar_test modifiable_fixed_transform_publisher.py 0 0 0  0.707 0 0 0.707 map imu/thorax 
  - rosrun ar_test modifiable_fixed_transform_publisher.py 0 0 0  0.707 0 0 0.707 map imu/humerus 
  - rosrun ar_test modifiable_fixed_transform_publisher.py 0 0 0  0.707 0 0 0.707 map imu/radius 
